<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Recognition</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="left">
    <i class="ri-arrow-left-line"></i>
    <span onclick="goToHome()" style="cursor:pointer;">Back to Home</span>
  </div>
  <div class="right">
    <i class="ri-settings-3-line"></i>
    <span>✨ Audio Recognition</span>
  </div>
</header>

<!-- MAIN CONTAINER -->
<div class="wrapper">
  <div class="card">

    <h1>Upload Yakshagana Audio</h1>

    <!-- UPLOAD BOX -->
    <div class="grid">
      <div class="box">
        <div class="circle orange">
          <i class="ri-upload-2-line"></i>
        </div>
        <h3>Upload Audio File</h3>
        <p>Select a WAV, MP3, or M4A file</p>
        <input type="file" id="audioFile" accept=".wav,.mp3,.m4a,.ogg,.flac,.webm">
      </div>
    </div>

    <!-- AUDIO PREVIEW -->
    <audio id="audioPlayer" controls style="display:none; width:100%; margin-top:16px;"></audio>

    <!-- STATUS MESSAGE -->
    <p id="upload-status" style="text-align:center; margin-top:12px; font-size:15px; min-height:24px;"></p>

    <!-- ACTION BUTTONS -->
    <div class="actions">
      <button class="reset">Reset</button>
      <button class="primary-btn" id="submitBtn" onclick="recognizeAudio()">
        ✨ Recognize & Extract Story
      </button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
